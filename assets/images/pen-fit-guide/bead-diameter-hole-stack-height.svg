<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="title desc">
<title id="title">Bead diameter, hole diameter and stack height</title><desc id="desc">D measures the outside diameter. d measures the hole opening. H measures the occupied height along the hole axis. Generic shapes, not to scale.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#168570"/></marker>
<linearGradient id="bead" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeaf3"/><stop offset="1" stop-color="#efa8c3"/></linearGradient>
<linearGradient id="metal"><stop stop-color="#bbc9cf"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#82949d"/></linearGradient></defs>
<rect width="520" height="720" rx="24" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="19" fill="#a73561" font-weight="700" text-anchor="start">01 / READ THE BEAD</text><text x="28" y="80" font-size="25" fill="#263346" font-weight="700" text-anchor="start">Outside size is not hole size.</text><text x="28" y="116" font-size="18" fill="#657184" font-weight="400" text-anchor="start">Generic shapes · not to scale</text><text x="50" y="161" font-size="16" fill="#657184" font-weight="700" text-anchor="start">END VIEW</text><circle cx="150" cy="252" r="78" fill="url(#bead)" stroke="#b54e77" stroke-width="2"/><circle cx="150" cy="252" r="16" fill="#fff" stroke="#a73561" stroke-width="2"/><line x1="134" y1="252" x2="166" y2="252" stroke="#168570" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="166" y1="252" x2="262" y2="224" stroke="#168570" stroke-width="2" /><text x="278" y="220" font-size="23" fill="#263346" font-weight="700" text-anchor="start">Ød: hole</text><text x="278" y="250" font-size="21" fill="#263346" font-weight="400" text-anchor="start">diameter</text><line x1="72" y1="252" x2="72" y2="355" stroke="#aebfc5" stroke-width="2" /><line x1="228" y1="252" x2="228" y2="355" stroke="#aebfc5" stroke-width="2" /><line x1="72" y1="348" x2="228" y2="348" stroke="#168570" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="150" y="384" font-size="21" fill="#263346" font-weight="700" text-anchor="middle">ØD: outside diameter</text><line x1="28" y1="415" x2="492" y2="415" stroke="#e5e9ef" stroke-width="2" /><text x="50" y="451" font-size="16" fill="#657184" font-weight="700" text-anchor="start">SIDE SECTION</text><ellipse cx="150" cy="541" rx="79" ry="52" fill="url(#bead)" stroke="#b54e77" stroke-width="2"/><path d="M138 489V593H162V489" fill="#fff" stroke="#a73561" stroke-width="2"/><line x1="150" y1="468" x2="150" y2="614" stroke="#82949d" stroke-width="2" stroke-dasharray="5 5"/><line x1="168" y1="489" x2="269" y2="489" stroke="#aebfc5" stroke-width="2" /><line x1="168" y1="593" x2="269" y2="593" stroke="#aebfc5" stroke-width="2" /><line x1="262" y1="489" x2="262" y2="593" stroke="#168570" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="283" y="526" font-size="23" fill="#263346" font-weight="700" text-anchor="start">H: stack</text><text x="283" y="555" font-size="23" fill="#263346" font-weight="700" text-anchor="start">height</text><text x="283" y="588" font-size="19" fill="#263346" font-weight="400" text-anchor="start">Along the</text><text x="283" y="613" font-size="19" fill="#263346" font-weight="400" text-anchor="start">hole axis</text><text x="28" y="652" font-size="19" fill="#657184" font-weight="400" text-anchor="start">On shaped beads, confirm the hole direction.</text>
<text x="28" y="696" font-size="16" fill="#657184" font-weight="400" text-anchor="start">Qula Craft  /  Measurement guide</text>
</g></svg>