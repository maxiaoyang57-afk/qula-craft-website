<svg xmlns="http://www.w3.org/2000/svg" width="520" height="730" viewBox="0 0 520 730" role="img" aria-labelledby="title desc">
<title id="title">Illustrative bead stack length calculation</title><desc id="desc">Three 15 mm bead heights and two 2 mm spacers occupy 49 mm. A hypothetical 50 mm usable pen length leaves 1 mm. These are example dimensions, not a recommended clearance or a Qula Craft pen specification.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#168570"/></marker>
<linearGradient id="bead" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeaf3"/><stop offset="1" stop-color="#efa8c3"/></linearGradient>
<linearGradient id="metal"><stop stop-color="#bbc9cf"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#82949d"/></linearGradient></defs>
<rect width="520" height="730" rx="24" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="19" fill="#a73561" font-weight="700" text-anchor="start">03 / PLAN THE STACK</text><text x="28" y="80" font-size="25" fill="#263346" font-weight="700" text-anchor="start">Will the whole layout fit?</text><text x="28" y="116" font-size="16" fill="#a73561" font-weight="700" text-anchor="start">ILLUSTRATIVE EXAMPLE · NOT A PRODUCT SPEC</text><rect x="102" y="174" width="16" height="300" fill="url(#metal)"/><rect x="59" y="174" width="102" height="6" fill="#fff0db" stroke="#a77935"/><ellipse cx="110" cy="225" rx="45" ry="45" fill="url(#bead)" stroke="#b54e77" stroke-width="2"/><line x1="155" y1="225" x2="218" y2="225" stroke="#b6bfc9" stroke-width="2" /><text x="231" y="232" font-size="21" fill="#263346" font-weight="400" text-anchor="start">15 mm bead height</text><ellipse cx="110" cy="327" rx="45" ry="45" fill="url(#bead)" stroke="#b54e77" stroke-width="2"/><line x1="155" y1="327" x2="218" y2="327" stroke="#b6bfc9" stroke-width="2" /><text x="231" y="334" font-size="21" fill="#263346" font-weight="400" text-anchor="start">15 mm bead height</text><ellipse cx="110" cy="429" rx="45" ry="45" fill="url(#bead)" stroke="#b54e77" stroke-width="2"/><line x1="155" y1="429" x2="218" y2="429" stroke="#b6bfc9" stroke-width="2" /><text x="231" y="436" font-size="21" fill="#263346" font-weight="400" text-anchor="start">15 mm bead height</text><rect x="81" y="270" width="58" height="12" rx="3" fill="#ade3d3" stroke="#168570"/><line x1="140" y1="276" x2="218" y2="276" stroke="#b6bfc9" stroke-width="2" /><text x="231" y="282" font-size="19" fill="#168570" font-weight="400" text-anchor="start">2 mm spacer</text><rect x="81" y="372" width="58" height="12" rx="3" fill="#ade3d3" stroke="#168570"/><line x1="140" y1="378" x2="218" y2="378" stroke="#b6bfc9" stroke-width="2" /><text x="231" y="384" font-size="19" fill="#168570" font-weight="400" text-anchor="start">2 mm spacer</text><line x1="28" y1="174" x2="53" y2="174" stroke="#aebfc5" stroke-width="2" /><line x1="28" y1="474" x2="161" y2="474" stroke="#aebfc5" stroke-width="2" /><line x1="35" y1="174" x2="35" y2="474" stroke="#168570" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="23" y="330" transform="rotate(-90 23 330)" font-size="19" fill="#168570" text-anchor="middle">L = 50 mm</text><line x1="162" y1="177" x2="218" y2="160" stroke="#a77935" stroke-width="2" /><text x="231" y="165" font-size="19" fill="#936a2e" font-weight="400" text-anchor="start">1 mm remaining</text><rect x="28" y="506" width="464" height="92" rx="16" fill="#f1faf7"/><text x="260" y="543" font-size="25" fill="#168570" font-weight="700" text-anchor="middle">3 × 15 + 2 × 2 = 49 mm</text><text x="260" y="576" font-size="21" fill="#263346" font-weight="400" text-anchor="middle">50 − 49 = 1 mm remaining</text><text x="28" y="638" font-size="23" fill="#263346" font-weight="700" text-anchor="start">Arithmetic is only a first check.</text><text x="28" y="669" font-size="19" fill="#657184" font-weight="400" text-anchor="start">Test closure and movement on a sample.</text>
<text x="28" y="706" font-size="16" fill="#657184" font-weight="400" text-anchor="start">Qula Craft  /  Measurement guide</text>
</g></svg>