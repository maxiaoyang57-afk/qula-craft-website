<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760" role="img" aria-labelledby="title desc">
<title id="title">Measure the pen rod and usable beading length</title><desc id="desc">L is the space between the lower shoulder and upper end-stop seat in its secured position. The drawing excludes the top attachment threads from L. r is the widest part of the rod that beads must pass over. No numeric pen dimensions are asserted.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#168570"/></marker>
<linearGradient id="bead" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeaf3"/><stop offset="1" stop-color="#efa8c3"/></linearGradient>
<linearGradient id="metal"><stop stop-color="#bbc9cf"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#82949d"/></linearGradient></defs>
<rect width="520" height="760" rx="24" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="19" fill="#a73561" font-weight="700" text-anchor="start">02 / MEASURE THE PEN</text><text x="28" y="80" font-size="25" fill="#263346" font-weight="700" text-anchor="start">Two measurements to request</text><text x="28" y="114" font-size="18" fill="#657184" font-weight="400" text-anchor="start">Generic pen · construction varies</text><rect x="108" y="161" width="70" height="52" rx="16" fill="#f3b5cb" stroke="#b54e77" stroke-width="2"/><text x="198" y="182" font-size="21" fill="#263346" font-weight="700" text-anchor="start">Removable end fitting</text><text x="198" y="210" font-size="18" fill="#657184" font-weight="400" text-anchor="start">Shown detached</text><rect x="134" y="252" width="18" height="248" fill="url(#metal)" stroke="#82949d"/><rect x="130" y="252" width="26" height="31" fill="#c5d0d5" stroke="#82949d"/><line x1="130" y1="256" x2="156" y2="254" stroke="#637984" stroke-width="2" /><line x1="130" y1="262" x2="156" y2="260" stroke="#637984" stroke-width="2" /><line x1="130" y1="268" x2="156" y2="266" stroke="#637984" stroke-width="2" /><line x1="130" y1="274" x2="156" y2="272" stroke="#637984" stroke-width="2" /><line x1="130" y1="280" x2="156" y2="278" stroke="#637984" stroke-width="2" /><line x1="118" y1="283" x2="359" y2="283" stroke="#aebfc5" stroke-width="2" stroke-dasharray="5 5"/><text x="210" y="258" font-size="20" fill="#263346" font-weight="700" text-anchor="start">End-stop seat</text><text x="210" y="311" font-size="17" fill="#657184" font-weight="400" text-anchor="start">Position when secured</text><rect x="113" y="500" width="60" height="22" rx="6" fill="url(#metal)" stroke="#82949d"/><rect x="117" y="522" width="52" height="125" rx="10" fill="#ade3d3" stroke="#168570" stroke-width="2"/><path d="M117 638H169L151 676H135Z" fill="#c2d0d6" stroke="#82949d"/><line x1="174" y1="500" x2="359" y2="500" stroke="#aebfc5" stroke-width="2" /><line x1="342" y1="283" x2="342" y2="500" stroke="#168570" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="318" y="380" font-size="34" fill="#168570" font-weight="700" text-anchor="end">L</text><text x="318" y="411" font-size="20" fill="#263346" font-weight="400" text-anchor="end">Usable</text><text x="318" y="438" font-size="20" fill="#263346" font-weight="400" text-anchor="end">bead space</text><text x="28" y="531" font-size="18" fill="#263346" font-weight="400" text-anchor="start">Lower</text><text x="28" y="555" font-size="18" fill="#263346" font-weight="400" text-anchor="start">shoulder</text><rect x="219" y="535" width="272" height="135" rx="16" fill="#f1faf7"/><text x="237" y="562" font-size="15" fill="#168570" font-weight="700" text-anchor="start">ROD / LOADING PATH</text><circle cx="260" cy="605" r="22" fill="url(#metal)" stroke="#82949d"/><line x1="238" y1="605" x2="282" y2="605" stroke="#168570" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="299" y="601" font-size="20" fill="#263346" font-weight="700" text-anchor="start">Ør: widest</text><text x="299" y="627" font-size="20" fill="#263346" font-weight="700" text-anchor="start">section</text><text x="28" y="707" font-size="18" fill="#657184" font-weight="400" text-anchor="start">Include threads in r if beads must pass over them.</text>
