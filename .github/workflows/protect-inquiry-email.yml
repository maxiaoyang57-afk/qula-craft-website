name: Protect inquiry email and products

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify inquiry routing
        run: node scripts/check-inquiry-email.mjs
      - name: Verify protected products
        run: node scripts/check-required-products.mjs
      - name: Verify SEO and batch image integrity
        run: node scripts/check-seo.mjs


  mobile-layout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile browser test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qula-http.log 2>&1 &
          echo $! > /tmp/qula-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/polymer-clay-sprinkles.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qula-http.log
          exit 1
      - name: Verify mobile menu, CTA and PDP rendering
        run: npx playwright test tests/mobile-layout.spec.js --reporter=line --workers=1
      - name: Upload mobile verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qula-mobile-layout-screenshots
          path: test-results/*.png
          if-no-files-found: warn
          retention-days: 7

  production-monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download uncached production homepage
        run: curl --fail --silent --show-error --location --retry 3 --max-time 30 "https://www.qulacrafts.com/?inquiry_guard=${GITHUB_RUN_ID}" --output /tmp/qula-production.html
      - name: Download uncached production product category
        run: curl --fail --silent --show-error --location --retry 3 --max-time 30 "https://www.qulacrafts.com/resin-charms.html?product_guard=${GITHUB_RUN_ID}" --output /tmp/qula-products.html
      - name: Verify production inquiry routing
        id: verify-production
        continue-on-error: true
        run: |
          node scripts/check-inquiry-email.mjs --live /tmp/qula-production.html
          node scripts/check-required-products.mjs --live /tmp/qula-products.html
      - name: Trigger automatic production restore
        if: steps.verify-production.outcome == 'failure'
        run: |
          git config user.name "QULA production guard"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Auto-restore protected production content"
          git push origin HEAD:main
      - name: Record automatic restore
        if: steps.verify-production.outcome == 'failure'
        run: echo "Protected production content drift was detected. A new main deployment has been triggered." >> "$GITHUB_STEP_SUMMARY"
