name: Notify IndexNow

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel production
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { GH_TOKEN, REPO, SHA } = process.env;
          const headers = {
            Authorization: `Bearer ${GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const url = `https://api.github.com/repos/${REPO}/commits/${SHA}/status`;
          const maxAttempts = 120;
          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            const r = await fetch(url, { headers });
            if (!r.ok) throw new Error(`GitHub status API returned ${r.status}`);
            const data = await r.json();
            const vercel = (data.statuses || []).find((s) => s.context === 'Vercel');
            if (vercel?.state === 'success') {
              console.log('Vercel production status is success.');
              process.exit(0);
            }
            if (vercel?.state === 'failure' || vercel?.state === 'error') {
              throw new Error(`Vercel deployment status is ${vercel.state}`);
            }
            if (attempt === 1 || attempt % 8 === 0) {
              const contexts = (data.statuses || []).map((s) => `${s.context}:${s.state}`).join(', ') || 'none';
              console.log(`Waiting for Vercel production... attempt ${attempt}/${maxAttempts}; commit statuses: ${contexts}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          throw new Error('Timed out after 30 minutes waiting for Vercel production status.');
          NODE

      - name: Verify IndexNow configuration
        run: node scripts/check-indexnow.mjs

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_SHA: ${{ github.sha }}
        run: node scripts/submit-indexnow.mjs
